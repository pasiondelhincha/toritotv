            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Observaciones fijas (opcional)</label>
            <input type="text" id="inputExerciseDefaultNotes" class="form-control" placeholder="Ej: Barra olímpica de 20kg, inclinación 30°...">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 16px;">
            <button type="button" class="btn btn-secondary" style="flex: 1;" id="btnCancelAddExercise">Cancelar</button>
            <button type="submit" class="btn btn-primary" style="flex: 2;">Guardar Ejercicio</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL: SELECCIONAR EJERCICIO PARA ENTRENAR     -->
  <!-- ============================================== -->
  <div class="modal-overlay" id="modalSelectExercise">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title">Añadir Ejercicio</h3>
        <button type="button" class="btn btn-secondary btn-sm" id="btnCloseSelectExerciseModal">✕</button>
      </div>
      <div class="modal-body">
        <!-- Quick search -->
        <input type="text" id="inputQuickSearchExercise" class="form-control" placeholder="Buscar en mis ejercicios..." style="margin-bottom: 12px;">
        
        <div id="selectExerciseListContainer" style="max-height: 45vh; overflow-y: auto;">
          <!-- List of selectable user exercises -->
        </div>

        <div style="margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 12px; text-align: center;">
          <button type="button" class="btn btn-outline btn-sm" id="btnQuickCreateExerciseFromModal">
            ➕ Crear un ejercicio nuevo
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item active" data-tab="viewTrain">
      <span class="nav-icon">🏋️</span>
      <span>Entrenar</span>
    </button>
    <button type="button" class="nav-item" data-tab="viewExercises">
      <span class="nav-icon">📋</span>
      <span>Ejercicios</span>
    </button>
    <button type="button" class="nav-item" data-tab="viewHistory">
      <span class="nav-icon">🔍</span>
      <span>Historial</span>
    </button>
    <button type="button" class="nav-item" data-tab="viewCalc">
      <span class="nav-icon">🧮</span>
      <span>1 RM</span>
    </button>
    <button type="button" class="nav-item" data-tab="viewSettings">
      <span class="nav-icon">⚙️</span>
      <span>Ajustes</span>
    </button>
  </nav>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main Controller Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

