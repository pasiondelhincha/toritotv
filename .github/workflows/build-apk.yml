# 📱 Guía Completa: Cómo Probar, Empaquetar y Desempaquetar tu APK

¡Bienvenido! Esta guía está pensada para que entiendas de manera muy sencilla y práctica qué es un APK, cómo probar tu cuaderno de gimnasio de inmediato y las distintas opciones que tienes para convertirlo en un archivo instalable en tu teléfono Android.

---

## 1. ¿Qué es un archivo APK y qué tiene por dentro?

Un archivo **APK** (*Android Package Kit*) es el formato que utiliza el sistema operativo Android para distribuir e instalar aplicaciones, tal como un archivo `.exe` o `.msi` funciona en Windows.

Por dentro, un APK es en realidad un **archivo comprimido tipo ZIP** que contiene:
- `AndroidManifest.xml`: El "DNI" de la app (nombre, icono, permisos, versión).
- `assets/` o carpetas web: En aplicaciones creadas con tecnologías modernas (como Capacitor), aquí vive toda la interfaz visual (el HTML, CSS, JavaScript e iconos que creamos).
- `classes.dex`: El código ejecutable compilado para la máquina virtual de Android (Dalvik/ART).
- `res/`: Recursos gráficos, iconos y estilos nativos.
- `META-INF/`: La firma digital y certificados que garantizan que el archivo no fue alterado.

---

## 2. Cómo Probar la Aplicación Ahora Mismo (En tu PC o en tu Celular)

Antes de empaquetar el APK, puedes probar y usar el cuaderno de gimnasio directamente en tu navegador o en tu teléfono sin instalar nada pesado:

### Opción A: Probar en tu PC
1. Abre una ventana de PowerShell o Terminal en la carpeta del proyecto:
   ```powershell
   cd "F:\MATERIAL GRAFICO\00IMAGE FX\19 PROYECTOS APK\gym-tracker"
   ```
2. Ejecuta un servidor local con Python (que ya lo tienes instalado):
   ```powershell
   python -m http.server 8080
   ```
3. Abre tu navegador web (Chrome, Edge o Brave) y entra a:
   [http://localhost:8080](http://localhost:8080)
4. ¡Listo! Verás la app lista para usar. Toca `F12` en tu teclado y activa la vista de móvil (icono de celular/tablet) para verla en formato smartphone.

### Opción B: Probarla directamente en la pantalla de tu celular (Vía Wi-Fi)
1. Con tu PC y tu celular conectados a la misma red Wi-Fi:
2. Averigua la IP de tu PC escribiendo en la terminal `ipconfig` (ejemplo: `192.168.1.35`).
3. En el navegador de tu celular escribe: `http://192.168.1.35:8080`.
4. En Chrome en tu celular, pulsa en los 3 puntos de arriba a la derecha y selecciona **"Agregar a la pantalla principal"** o **"Instalar aplicación"**. Se instalará como si fuera una app nativa con su icono de mancuerna y funcionará 100% offline.

---

## 3. Cómo Empaquetar a APK (Las 2 mejores opciones)

### Método 1: Crear el APK en la Nube con GitHub (Sin instalar Android Studio)
Si no quieres descargar los 4 a 8 GB que pesa Android Studio y sus SDKs, el proyecto ya viene con el archivo automatizado `.github/workflows/build-apk.yml`:

1. Sube esta carpeta a un repositorio tuyo en GitHub (puedes crearlo privado o público).
2. Entra a la pestaña **Actions** en tu repositorio de GitHub.
3. El proceso de compilación se ejecutará solo en los servidores de GitHub.
4. Al finalizar (tarda unos 2 a 3 minutos), en la sección **Artifacts** podrás descargar el archivo `CuadernoGym-debug.apk` directamente a tu computadora o celular.

---

### Método 2: El Método Nativo Oficial con Capacitor + Android Studio
Si deseas compilarlo tú mismo en tu propia computadora:

#### Requisitos previos en Windows:
1. **Node.js**: Ya lo tienes instalado en tu PC (`v26.13.0`).
2. **Java JDK 17 o superior**: Descárgalo gratis desde [Adoptium / Eclipse Temurin JDK 17](https://adoptium.net/).
3. **Android Studio**: Descárgalo desde [developer.android.com/studio](https://developer.android.com/studio). Durante la instalación asegúrate de marcar:
   - Android SDK
   - Android SDK Command-line Tools
   - Android Virtual Device (opcional, para emulador)

#### Pasos para generar el APK:
1. Abre PowerShell en la carpeta del proyecto:
   ```powershell
   cd "F:\MATERIAL GRAFICO\00IMAGE FX\19 PROYECTOS APK\gym-tracker"
   ```
2. Instala las herramientas de Capacitor:
   ```powershell
   npm.cmd install
   ```
3. Inicializa la carpeta de Android dentro del proyecto:
   ```powershell
   npx.cmd cap add android
   ```
4. Sincroniza los archivos de la app con el proyecto de Android:
   ```powershell
   npx.cmd cap sync android
   ```
5. Abre el proyecto en Android Studio:
   ```powershell
   npx.cmd cap open android
   ```
6. En Android Studio:
   - Espera a que termine de cargar el proceso inferior (Gradle Sync).
   - En el menú superior haz clic en: **Build** ➔ **Build Bundle(s) / APK(s)** ➔ **Build APK(s)**.
7. Al terminar aparecerá un mensaje en la esquina inferior derecha con un enlace azul que dice **locate**. Haz clic allí y te abrirá la carpeta con tu archivo:
   `app-debug.apk`

---

## 4. Cómo Instalar el APK en tu Celular

1. Pasa el archivo `app-debug.apk` a tu teléfono (por cable USB, enviándotelo por Telegram, WhatsApp o subiéndolo a Google Drive).
2. En tu teléfono, abre el explorador de archivos y toca sobre `app-debug.apk`.
3. Android te mostrará una advertencia de seguridad indicando que la app proviene de una fuente desconocida (esto es normal para cualquier app que no provenga de Google Play Store).
4. Toca en **Configuración** ➔ Activa **"Permitir desde esta fuente"** ➔ Toca **Instalar**.
5. ¡Listo! Ya tendrás tu app instalada con su propio acceso directo en tu menú de aplicaciones.

---

## 5. Cómo Desempaquetar un archivo APK

Si en el futuro descargas cualquier archivo APK o quieres ver qué tiene por dentro tu propio APK, existen dos formas de desempaquetarlo:

### A) El truco rápido (Para ver recursos, imágenes y archivos web)
1. Haz una copia de tu archivo `app-debug.apk`.
2. Renombra la extensión del archivo cambiando `.apk` por `.zip` (ejemplo: `app-debug.zip`).
   *(Si Windows no te muestra las extensiones, en el Explorador de archivos ve a "Vista" ➔ Marca "Extensiones de nombre de archivo")*.
3. Haz clic derecho y elige **"Extraer todo..."** o ábrelo con **7-Zip** o **WinRAR**.
4. Podrás explorar carpetas como `assets/`, donde encontrarás los archivos `index.html`, imágenes, etc.

### B) Descompilación avanzada (Para analizar el código y manifiesto)
Si necesitas ver el código fuente descompilado o editar el `AndroidManifest.xml`:
- **JADX-GUI**: Es la herramienta más popular y amigable. Descargas [JADX](https://github.com/skylot/jadx/releases), abres el ejecutable `jadx-gui.bat` y arrastras tu archivo `.apk`. Podrás leer todo el código descompilado de forma visual como si estuvieras en un editor de texto.
- **APKTool**: Herramienta por consola (`apktool d mi-app.apk`) que decodifica los recursos a su forma original para poder modificarlos y volver a empaquetarlos (`apktool b`).

---

## 6. Funcionalidades integradas en tu App

- **Catálogo propio desde cero**: No viene con ejercicios precargados. Tú vas creando tus ejercicios con sus grupos musculares (Pecho, Espalda, Piernas, etc.).
- **Variantes y Salvedades**: Puedes anotar "(sin venda)", "(con venda)", "(agarre neutro)", etc. en cada ejercicio y buscarlo fácilmente más adelante.
- **Series dinámicas**: Botón `+ Agregar Serie` para sumar una a una las series con su peso en kg y repeticiones. Al agregar una nueva serie, copia automáticamente el peso y reps de la serie previa para que no pierdas tiempo escribiendo entre descansos.
- **Peso corporal diario**: Campo dedicado en el encabezado de cada sesión para llevar el control de tu peso corporal en kg.
- **Buscador y Filtros**: Busca por nombre de ejercicio, por variante (ej: escribe "sin venda" para ver todos los días que entrenaste sin venda), o por grupo muscular.
- **Calculadora 1RM (1 a 20 repeticiones)**: Calcula tu repetición máxima con fórmulas validadas (Brzycki, Epley, Lombardi, O'Conner) y te muestra la tabla completa de porcentajes (del 100% al 50%) para saber cuánto peso poner según las repeticiones que busques.
- **Respaldo Seguro**: En la pestaña Ajustes puedes descargar una copia de seguridad en JSON para no perder nunca tus registros.

